# Temporary ACME bootstrap for the two official Electra Afikim exam portals.
server {
 listen 80;
 listen [::]:80;
 server_name test.brillteamp.com adm.brillteamp.com;
 location ^~ /.well-known/acme-challenge/ {
  root /var/www/letsencrypt;
  try_files $uri =404;
 }
 location / { return 308 https://$host$request_uri; }
}
