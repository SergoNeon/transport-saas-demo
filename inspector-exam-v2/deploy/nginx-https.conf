server {
    listen 80;
    listen [::]:80;
    server_name afikim.77.42.93.209.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name afikim.77.42.93.209.sslip.io;

    ssl_certificate /etc/letsencrypt/live/afikim-exam-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afikim-exam-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32k;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    location / {
        proxy_pass http://127.0.0.1:18439;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
