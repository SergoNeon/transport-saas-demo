<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d55"><title>Transit Inspect — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;font:16px system-ui,Arial;color:#132b47}.wrap{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:20px}header{background:#102d55;color:white;padding:22px;border-radius:18px;margin-bottom:20px}h1{margin:4px 0;font-size:25px}.muted{opacity:.75;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#eff5fc;padding:14px 7px;border-radius:12px;text-align:center}.stat b{display:block;font-size:24px}button,select,input{font:inherit;border-radius:12px;padding:13px;border:1px solid #d6dfeb}button{background:#1760bd;color:white;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:12px 0 6px;font-weight:600}select,input{width:100%;background:white}.card{padding:18px;border:1px solid #e2e9f2;border-radius:16px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{background:#e6f4eb;color:#19683c;border-radius:30px;padding:6px 10px;font-size:12px}.entry{padding:12px 0;border-bottom:1px solid #e9eef5}.small{font-size:12px;color:#66768a}.notice{font-size:12px;color:#6c5260;background:#fff2d9;padding:12px;border-radius:10px;margin:14px 0}#screen{display:none}</style><div class="wrap"><header><div class="row"><strong>TRANSIT INSPECT</strong><span class="tag">DEMO</span></div><h1>מערכת פיקוח חכמה</h1><div class="muted">Universal inspection platform · Israel</div></header><div class="notice">הדגמה בלבד: נתונים מדומים נשמרים בדפדפן זה. אין חיבור לרב-קו או למערכת קנסות רשמית.</div><section id="login"><h2>כניסה להדגמה</h2><label>חברת תחבורה</label><select id="tenant"><option value="a">מפעיל הדגמה א׳</option><option value="b">מפעיל הדגמה ב׳</option></select><p class="small">בחר חברה כדי לבדוק הפרדה בין נתונים</p><button style="width:100%" onclick="enter()">התחל משמרת דמו</button></section><section id="screen"><div class="row"><h2>לוח הבקרה</h2><button style="background:#dce9f9;color:#123b72" onclick="logout()">החלף חברה</button></div><div class="small" id="company"></div><div class="stats"><div class="stat"><b id="total">0</b>בדיקות</div><div class="stat"><b id="valid">0</b>תקין</div><div class="stat"><b id="issues">0</b>אירועים</div></div><div class="card"><h3>בדיקה חדשה</h3><label>קו</label><input id="route" placeholder="למשל 66" maxlength="12"><label>מספר אוטובוס</label><input id="vehicle" placeholder="מספר רכב" maxlength="16"><label>תוצאת בדיקה</label><select id="result"><option value="valid">תקין</option><option value="invalid">לא תקין (דמו)</option><option value="unverified">לא אומת</option><option value="incident">אירוע</option></select><button style="width:100%;margin-top:16px" onclick="save()">שמור בדיקה</button></div><div class="card"><div class="row"><h3>בדיקות אחרונות</h3><span class="small" id="count"></span></div><div id="entries"></div></div></section></div><script>let current='';const $=id=>document.getElementById(id);function data(){try{return JSON.parse(localStorage.getItem('transit-inspect-demo:'+current)||'[]')}catch{return []}}function enter(){current=$('tenant').value;$('login').style.display='none';$('screen').style.display='block';$('company').textContent=$('tenant').selectedOptions[0].textContent;render()}function logout(){current='';$('login').style.display='block';$('screen').style.display='none'}function save(){const rows=data();rows.unshift({id:crypto.randomUUID(),route:$('route').value.trim(),vehicle:$('vehicle').value.trim(),result:$('result').value,time:new Date().toLocaleString('he-IL')});localStorage.setItem('transit-inspect-demo:'+current,JSON.stringify(rows.slice(0,100)));$('route').value='';$('vehicle').value='';render()}function render(){const rows=data();$('total').textContent=rows.length;$('valid').textContent=rows.filter(x=>x.result==='valid').length;$('issues').textContent=rows.filter(x=>x.result==='invalid'||x.result==='incident').length;$('count').textContent=rows.length+' רשומות';const e=$('entries');e.replaceChildren();if(!rows.length){e.textContent='עדיין אין בדיקות';return}rows.forEach(x=>{const d=document.createElement('div');d.className='entry';const t=document.createElement('strong');t.textContent='קו '+(x.route||'—')+' · '+({valid:'תקין',invalid:'לא תקין',unverified:'לא אומת',incident:'אירוע'}[x.result]||x.result);const s=document.createElement('div');s.className='small';s.textContent=x.time+' · רכב '+(x.vehicle||'—');d.append(t,s);e.append(d)})}</script></html>
